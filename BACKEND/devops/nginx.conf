worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 6m;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

  upstream customer_api { server customer-api:8000; keepalive 32; }
  upstream admin_api { server admin-api:8000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Portfolio stays at the root, with the active shopping and mail apps on
    # same-origin paths. All API calls keep their normal protected routing.
    location = /cart { return 302 /cart/customer_page_1_home_storefront_rtcrackers/code.html; }
    location = /cart/ { return 302 /cart/customer_page_1_home_storefront_rtcrackers/code.html; }
    location ^~ /cart/ {
      alias /usr/share/nginx/html/site/;
      index index.html;
      try_files $request_filename =404;
    }

    location = /combos { return 302 /cart/combo_packs_red_thunder_crackers/code.html; }
    location = /admin { return 302 /cart/admin_login_rtcrackers/code.html; }
    location = /admin/ { return 302 /cart/admin_login_rtcrackers/code.html; }
    location = /admin.html { return 302 /admin; }
    location = /admin-dashboard.html { return 302 /admin; }
    location = /admin-register.html { return 302 /admin; }
    location = /mail { return 302 /FRONTEND/EMAIL/PAGES/inbox.html; }
    location = /mail/ { return 302 /FRONTEND/EMAIL/PAGES/inbox.html; }

    location ^~ /FRONTEND/EMAIL/ {
      alias /usr/share/nginx/html/email/;
      try_files $uri $uri/ =404;
    }
    location ^~ /ASSETS/ {
      alias /usr/share/nginx/html/assets-root/;
      try_files $request_filename =404;
    }

    location = /health { proxy_pass http://customer_api/health; proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id; }
    location = /ready { proxy_pass http://customer_api/ready; proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id; }
    location = /metrics { proxy_pass http://customer_api/metrics; proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id; }

    location ^~ /api/v1/admin/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://admin_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
    location ^~ /api/v1/admin/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://admin_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
    # Compatibility for older mail clients; new mail pages call /admin/mail.
    location ^~ /api/v1/email/ {
      limit_req zone=api burst=30 nodelay;
      rewrite ^/api/v1/email/(.*)$ /api/v1/admin/mail/$1 break;
      proxy_pass http://admin_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
    location ^~ /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://customer_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
    location ^~ /api/v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://customer_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2|mp4|avif)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location /media/ {
      alias /usr/share/nginx/html/media/;
      expires 1d;
      add_header Cache-Control "public, max-age=86400, immutable";
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
