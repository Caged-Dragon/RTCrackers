worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 6m;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

  upstream customer_api { server customer-api:8000; keepalive 32; }
  upstream admin_api { server admin-api:8000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health { proxy_pass http://customer_api/health; include /etc/nginx/proxy_params; }
    location = /ready { proxy_pass http://customer_api/ready; include /etc/nginx/proxy_params; }
    location = /metrics { proxy_pass http://customer_api/metrics; include /etc/nginx/proxy_params; }

    location ^~ /api/v1/admin/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://admin_api;
      include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/admin/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://admin_api;
      include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://customer_api;
      include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://customer_api;
      include /etc/nginx/proxy_params;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2|mp4)$ {\n      expires 7d;\n      add_header Cache-Control "public, max-age=604800";\n      try_files $uri =404;\n    }\n\n    location /media/ {
      try_files $uri =404;
      expires 1d;
      add_header Cache-Control "public, max-age=86400, immutable";
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
