<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | RTCrackers</title><link rel="stylesheet" href="css/style.css?v=20261003">

  <link rel="stylesheet" href="css/premium-ui.css?v=20261003"><link rel="stylesheet" href="css/animations.css?v=20261003"><style>body{min-height:100vh;background:radial-gradient(circle at 15% 10%,#ffcf55 0,transparent 24%),linear-gradient(145deg,#07112f,#172b68 55%,#a71925);display:grid;place-items:center;padding:20px}.reset-card{width:min(440px,100%);background:rgba(255,255,255,.96);border-radius:28px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.reset-card h1{margin:0 0 8px;font-size:30px}.reset-card p{color:#69728b;font-size:13px}.reset-msg{display:none;margin:14px 0;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:700}.reset-msg.show{display:block}.ok{background:#e8f7ee;color:#17653a}.err{background:#fff0ef;color:#9d241e}</style>  <link rel="stylesheet" href="css/adaptive-layout.css?v=20261003-v6">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/css/pwa-update.css">
</head><body><main class="reset-card" data-rt-reveal><div style="font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#d62828">RTCRACKERS</div><h1>Set a new password</h1><p id="identityText">Use this secure recovery session to set a new password for your account.</p><div id="resetMsg" class="reset-msg"></div><form id="resetForm"><label style="font-weight:800;font-size:13px">New password<input id="newPassword" type="password" minlength="6" required autocomplete="new-password" style="width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9deea;border-radius:14px"></label><label style="font-weight:800;font-size:13px;display:block;margin-top:14px">Confirm password<input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" style="width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9deea;border-radius:14px"></label><button class="btn btn-primary btn-block" style="margin-top:18px">Update password</button></form><p style="text-align:center;margin-top:18px"><a href="login.html">Back to customer login</a> · <a href="admin.html">Admin login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/theme.js"></script>
  <script src="js/micro-interactions.js"></script><script src="js/auth.js?v=20261003"></script><script src="js/features.js?v=20261003"></script><script>
(async()=>{const A=window.RTAdmin,msg=document.getElementById('resetMsg'),form=document.getElementById('resetForm');const show=(t,c)=>{msg.textContent=t;msg.className='reset-msg show '+c};if(!A?.configured){show('Supabase is not configured.','err');form.style.display='none';return}await A.authReady;const u=A.currentUser();if(!u){show('This recovery link is invalid or has expired. Request a new reset link.','err');form.style.display='none';return}document.getElementById('identityText').textContent='Recovery session active for '+(u.email||'your account')+'. Set a new password below.';form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){show('Passwords do not match.','err');return}const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Updating…';const r=await A.updateRecoveredPassword(p);btn.disabled=false;btn.textContent='Update password';if(!r.ok){show(r.error,'err');return}show('Password updated successfully. You can now sign in with the new password.','ok');setTimeout(()=>location.href='login.html',1200)})})();</script><script src="js/animations.js?v=20261003"></script>  <script src="js/advanced-ui.js?v=20261003"></script>
<script src="js/industrial-ui.js?v=20261003"></script><script src="components/customer-shell.js?v=20261003"></script>
